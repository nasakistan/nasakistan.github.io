<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zinrã | Void Room</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow: hidden; /* Mantém preso na "Void Room" */
        }

        .void-grid {
            position: absolute;
            width: 200vw;
            height: 200vh;
            top: -50%;
            left: -50%;
            background-size: 60px 60px;
            background-image: 
                linear-gradient(to right, rgba(168, 85, 247, 0.08) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(168, 85, 247, 0.08) 1px, transparent 1px);
            transform: perspective(600px) rotateX(60deg) translateY(100px) translateZ(-200px);
            animation: gridMove 20s linear infinite;
            /* Máscara para fazer a grade sumir na escuridão */
            -webkit-mask-image: radial-gradient(circle at center, black 10%, transparent 60%);
            mask-image: radial-gradient(circle at center, black 10%, transparent 60%);
            z-index: 0;
            pointer-events: none;
        }

        @keyframes gridMove {
            0% { transform: perspective(600px) rotateX(60deg) translateY(0px) translateZ(-200px); }
            100% { transform: perspective(600px) rotateX(60deg) translateY(60px) translateZ(-200px); }
        }

        @keyframes rainbowShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .rainbow-text {
            /* Gradiente dominado por roxo/magenta com um flash de rainbow */
            background: linear-gradient(
                270deg, 
                #7e22ce, /* Roxo Escuro */
                #a855f7, /* Roxo Claro */
                #ec4899, /* Rosa */
                #3b82f6, /* Azul */
                #10b981, /* Verde (Flash) */
                #eab308, /* Amarelo (Flash) */
                #ec4899, /* Rosa */
                #a855f7, /* Roxo Claro */
                #4c1d95  /* Roxo Profundo */
            );
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbowShift 6s ease infinite;
        }

        .rainbow-glow {
            position: absolute;
            inset: -2px;
            background: linear-gradient(270deg, #7e22ce, #a855f7, #ec4899, #3b82f6, #10b981, #eab308, #a855f7);
            background-size: 300% 300%;
            border-radius: inherit;
            filter: blur(8px);
            opacity: 0;
            transition: opacity 0.3s ease;
            animation: rainbowShift 6s ease infinite;
            z-index: -1;
        }

        .glass-card {
            background: rgba(10, 10, 10, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(168, 85, 247, 0.2);
            position: relative;
            z-index: 10;
        }

        .stack-item {
            position: relative;
            background: rgba(15, 15, 15, 0.8);
            border: 1px solid rgba(168, 85, 247, 0.3);
            color: #d8b4fe; /* purple-300 */
            transition: all 0.3s ease;
        }

        .stack-item:hover {
            color: #ffffff;
            border-color: #a855f7;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.6), inset 0 0 10px rgba(168, 85, 247, 0.2);
            transform: translateY(-2px);
        }

        .contact-btn {
            position: relative;
            transition: all 0.3s ease;
        }

        .contact-btn:hover .rainbow-glow {
            opacity: 1;
        }

        .contact-btn:hover {
            transform: scale(1.05);
        }

        /* Central Glowing Orb */
        .void-orb {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40vw;
            height: 40vw;
            background: radial-gradient(circle, rgba(147,51,234,0.15) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            z-index: 1;
            pointer-events: none;
        }
    </style>
</head>
